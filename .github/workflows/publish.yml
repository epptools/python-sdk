name: publish

# Publishes to PyPI when you cut a GitHub Release.
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo. One-time setup:
# on https://pypi.org add a "pending publisher" for project `epptools`, owner `epptools`,
# repo `python-sdk`, workflow `publish.yml`, environment `pypi`.

# Publishing a GitHub Release for a tag fires BOTH `release` and `push: tags`, so the workflow ran
# twice for one version and the second run failed on PyPI's "file already exists" — a red X on a
# release that actually succeeded, which is indistinguishable from one that did not.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Publishing is irreversible — a version number on PyPI can never be reused — so the suite runs
      # here as well as in CI. The gap it closes is a release cut from a commit CI never saw.
      - name: offline suite
        run: python tests/offline_test.py

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # Catches what otherwise only surfaces at upload time: an unrenderable README, missing metadata.
      - name: Check the built metadata
        run: python -m twine check dist/*

      # The release's tag is its only public statement of the version; pyproject.toml is what ends up
      # ON PyPI. When they disagree the upload publishes a version nobody announced, under a number
      # that can never be reused.
      #
      # Skipped unless the ref IS a tag. On a workflow_dispatch run GITHUB_REF_NAME holds the branch
      # name, so an unconditional check compares "main" against "1.0.0" and fails every manual run.
      - name: tag must match the packaged version
        if: github.ref_type == 'tag'
        run: |
          packaged="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "release tag $GITHUB_REF_NAME says $tagged, pyproject.toml says $packaged" >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
